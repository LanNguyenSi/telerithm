# Negative-control fixture for scripts/validate-sender-configs.sh.
#
# does_not_exist_plugin is not a registered plugin, so `fluentd --dry-run`
# itself exits non-zero ("plugin ... is not installed"). The check reports the
# dry run's own failure ("fluentd --dry-run failed") and propagates its exit
# code. Do not "fix" this file.
<match **>
  @type does_not_exist_plugin
</match>
