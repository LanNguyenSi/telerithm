# Positive-control fixture for scripts/validate-sender-configs.sh.
#
# The only oddity is a record VALUE that contains the words "is not used".
# fluentd --dry-run exits 0 (no warning), but it echoes the whole config, so a
# check that greps the output for a bare "is not used" would fail this passing
# config. The check matches only fluentd's warning header line, so this config
# passes. This file must stay valid; the phrase is the point, do not remove it.
<filter docker.**>
  @type record_transformer
  renew_record true
  <record>
    message ${record["log"]}
    note "this field is not used downstream"
  </record>
</filter>

<match **>
  @type stdout
</match>
