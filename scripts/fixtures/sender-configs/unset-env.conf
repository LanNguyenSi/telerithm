# Negative-control fixture for scripts/validate-sender-configs.sh.
#
# UNSET_NAME is never set by the check, so fluentd substitutes an empty
# string and `fluentd --dry-run` exits 0 with no warning at all. The
# ENV-name check flags the reference instead. Do not "fix" this file.
<match **>
  @type http
  endpoint "http://example.com/#{ENV['UNSET_NAME']}"
  http_method post
  <buffer>
    @type memory
  </buffer>
</match>
