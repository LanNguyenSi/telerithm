# Fluentd configuration for shipping logs to Telerithm
#
# REFERENCE FOR LOCAL / SINGLE-HOST USE. The forward input below listens on
# 127.0.0.1 only and has no authentication, so only processes on the same host
# can send to it. Before using it anywhere else, read "For production" below.
#
# Usage: Set env vars TELERITHM_URL, TELERITHM_SOURCE_ID, TELERITHM_API_KEY
#
# Docker log driver config (in docker-compose.yml):
#   logging:
#     driver: fluentd
#     options:
#       fluentd-address: localhost:24224
#       tag: "docker.{{.Name}}"
#
# For production:
#   - Keep the input on loopback. If Fluentd itself runs in a container, the
#     loopback of the container is not the host's, so bind 0.0.0.0 INSIDE the
#     container and publish the port on loopback only
#     (ports: ["127.0.0.1:24224:24224"]); never publish it on 0.0.0.0.
#   - Logs from other hosts: bind a private interface address (not 0.0.0.0),
#     restrict it with a firewall to the sending hosts, and enable the shared
#     key block in the source below. Anyone who can reach an open forward port
#     without a key can inject fake log lines.
#   - Keep the shared key out of this file; read it from the environment.

# --- Source: Accept logs from Docker log driver ---
<source>
  @type forward
  port 24224
  bind 127.0.0.1

  # Multi-host use: uncomment, set FLUENTD_SHARED_KEY (the same value on every
  # sender) and change bind to the private interface address. Senders then
  # need the matching shared_key (for Fluentd senders, in the security block of
  # out_forward). Add TLS (a transport tls section) as well when the network
  # between the hosts is not trusted.
  # ENV.fetch fails at start when the variable is unset, instead of silently
  # running with an empty key.
  # <security>
  #   self_hostname "#{Socket.gethostname}"
  #   shared_key "#{ENV.fetch('FLUENTD_SHARED_KEY')}"
  # </security>
</source>

# --- Filter: Parse JSON logs ---
# Lines that are not JSON pass through unchanged (reserve_data keeps the
# record, emit_invalid_record_to_error false keeps the failure out of the
# error stream).
<filter docker.**>
  @type parser
  key_name log
  reserve_data true
  emit_invalid_record_to_error false
  <parse>
    @type json
  </parse>
</filter>

# --- Filter: Map the record to the Telerithm log entry fields ---
# The ingest endpoint reads timestamp, message, level, service, host and fields.
# The Docker log driver supplies the raw line as "log", so use it as the message
# unless the JSON line carried its own. An unknown level would make the endpoint
# reject the whole batch, so anything outside its list becomes "info".
<filter docker.**>
  @type record_transformer
  enable_ruby true
  renew_record true
  <record>
    message ${(record["message"] || record["log"]).to_s}
    level ${l = record["level"].to_s.downcase; l = "warn" if l == "warning"; %w[debug info warn error fatal].include?(l) ? l : "info"}
    service ${(record["service"] || record["container_name"]).to_s.sub(%r{\A/}, "")}
    host ${(record["host"] || Socket.gethostname).to_s}
    timestamp ${Time.at(time).utc.strftime("%Y-%m-%dT%H:%M:%S.%LZ")}
    fields ${{ "container_id" => record["container_id"].to_s, "stream" => record["source"].to_s }}
  </record>
</filter>

# --- Match: Send to Telerithm ---
<match docker.**>
  @type http

  endpoint "#{ENV['TELERITHM_URL']}/api/v1/ingest/#{ENV['TELERITHM_SOURCE_ID']}"

  http_method post
  content_type application/json
  json_array true

  # 429 is the ingest rate limit; retry it (and 503) instead of dropping the chunk
  retryable_response_codes [429, 503]

  # The ingest endpoint takes a bare JSON array (json_array above) as well as
  # { "logs": [...] }. Embedded Ruby is only evaluated inside a double-quoted
  # string, so the hash is written as a quoted JSON string.
  headers "{\"X-API-Key\": \"#{ENV['TELERITHM_API_KEY']}\"}"

  <format>
    @type json
  </format>

  # Buffer for reliability
  <buffer>
    @type file
    path /fluentd/log/buffer
    flush_interval 5s
    chunk_limit_size 1m
    total_limit_size 256m
    retry_max_times 5
    retry_wait 10s
    retry_exponential_backoff_base 2
  </buffer>
</match>
