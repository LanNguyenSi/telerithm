# Vector.dev configuration for shipping container logs to Telerithm
# Usage: TELERITHM_URL=http://localhost:4000 TELERITHM_SOURCE_ID=xxx TELERITHM_API_KEY=lf_xxx vector --config vector.toml

# --- Source: Collect Docker container logs ---
[sources.docker]
type = "docker_logs"
# Optionally filter by container labels:
# include_labels = ["telerithm.enabled=true"]

# --- Transform: Parse and normalize log entries ---
[transforms.parse]
type = "remap"
inputs = ["docker"]
source = '''
# Try to parse as JSON first. Anything that is not a JSON object is treated as
# plain text.
parsed, err = parse_json(.message)
if err == null && is_object(parsed) {
  .level = downcase(string(parsed.level) ?? "info")
  .service = string(parsed.service) ?? .container_name
  .host = string(parsed.host) ?? .host
  .message = string(parsed.message) ?? .message
  .fields = {}
} else {
  # Plain text: try to detect log level from message
  msg = string(.message) ?? ""
  if match(msg, r'(?i)\berror\b') {
    .level = "error"
  } else if match(msg, r'(?i)\bwarn(ing)?\b') {
    .level = "warn"
  } else {
    .level = "info"
  }
  .service = .container_name
  .fields = {}
}

# The ingest endpoint rejects the whole batch for a level it does not know
if .level == "warning" {
  .level = "warn"
}
if !includes(["debug", "info", "warn", "error", "fatal"], .level) {
  .level = "info"
}

# Ensure timestamp is ISO format (UTC, with a trailing Z)
if !is_timestamp(.timestamp) {
  .timestamp = now()
}
.timestamp = format_timestamp!(.timestamp, format: "%Y-%m-%dT%H:%M:%S%.3fZ")
'''

# --- Transform: Format for Telerithm ingest API ---
[transforms.format]
type = "remap"
inputs = ["parse"]
source = '''
. = {
  "timestamp": .timestamp,
  "level": .level,
  "service": .service,
  "host": .host,
  "message": .message,
  "fields": .fields
}
'''

# --- Sink: Send to Telerithm HTTP ingest endpoint ---
[sinks.telerithm]
type = "http"
inputs = ["format"]
uri = "${TELERITHM_URL}/api/v1/ingest/${TELERITHM_SOURCE_ID}"
method = "post"
encoding.codec = "json"

# Batch settings: send every 5s or when 100 events are buffered
[sinks.telerithm.batch]
max_events = 100
timeout_secs = 5

# Request headers. The json codec posts each batch as a bare JSON array of
# events, and POST /ingest/:sourceId accepts that as well as { "logs": [...] }.
[sinks.telerithm.request]
headers.X-API-Key = "${TELERITHM_API_KEY}"
headers.Content-Type = "application/json"

# Buffer to disk for reliability
[sinks.telerithm.buffer]
type = "disk"
max_size = 268435488  # 256MB, the smallest disk buffer Vector accepts
when_full = "block"
