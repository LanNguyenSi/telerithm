# Fixed project name: the deployed stack lives in the directory DEPLOYMENT.md
# clones into (telerithm), so Compose already used this name. Pinning it keeps
# container, network and volume names (telerithm_pgdata, telerithm_chdata, ...)
# stable if the checkout directory is ever renamed or moved.
name: telerithm

# Production deployment with Traefik integration
# Assumes Traefik is already running on the VPS with:
# - Docker network: traefik
# - Certificate resolver: letsencrypt

# Bounded container logs: without this the json-file driver grows unbounded
# (same class of problem as the ClickHouse system.text_log incident 2026-07-15).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: telerithm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: telerithm
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - telerithm-internal
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telerithm"]
      interval: 10s
      timeout: 5s
      retries: 5

  clickhouse:
    image: clickhouse/clickhouse-server:24
    restart: unless-stopped
    logging: *default-logging
    environment:
      # Newer clickhouse-server images (measured on 24.12.6.70) write
      # users.d/default-user.xml on every start, even without any CLICKHOUSE_*
      # user variable (it restricts `default` to localhost). That write fails
      # on the read-only users.d mount below and the container exits at start;
      # with a writable mount it would cut the backend off. Setting this makes
      # the entrypoint skip the user setup, so `default` stays reachable from
      # the backend container as before. 24.10 (the current `:24`) ignores it.
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    volumes:
      - chdata:/var/lib/clickhouse
      - ./backend/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      # Mount the directory, not single files: a file bind mount pins the inode,
      # so a deploy that replaces limits.xml (git writes a new file) would leave
      # the running container on the old content until it is recreated.
      - ./backend/clickhouse/config.d:/etc/clickhouse-server/config.d:ro
      # Profiles (per-query memory cap, spill thresholds) are only read from
      # the users config, so they live in users.d, not in config.d. Read-only
      # on purpose: the image entrypoint writes users.d/default-user.xml
      # (clickhouse-server 24.10: only when CLICKHOUSE_USER other than
      # default, CLICKHOUSE_PASSWORD, CLICKHOUSE_PASSWORD_FILE or
      # CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT is set; newer images: on every
      # start unless CLICKHOUSE_SKIP_USER_SETUP is set, see `environment`),
      # which fails on this mount and stops the container at start. Do not
      # set those variables on this service; define users in a file in this
      # directory instead (DEPLOYMENT.md, "ClickHouse configuration changes").
      - ./backend/clickhouse/users.d:/etc/clickhouse-server/users.d:ro
    networks:
      - telerithm-internal
    deploy:
      resources:
        limits:
          memory: 3G
          cpus: "2.0"
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    restart: unless-stopped
    logging: *default-logging
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    networks:
      - telerithm-internal
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *default-logging
    environment:
      HOST: 0.0.0.0
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: postgresql://telerithm:${POSTGRES_PASSWORD}@postgres:5432/telerithm?connection_limit=20&pool_timeout=10
      CLICKHOUSE_URL: http://clickhouse:8123
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: https://demo.telerithm.cloud,https://play.telerithm.cloud
      # Number of reverse-proxy hops in front of the backend, so the IP-keyed
      # rate limiters see the real client address. 1 = Traefik only; raise it
      # if another proxy or CDN sits in front of Traefik (see docs/configuration.md).
      TRUST_PROXY: ${TRUST_PROXY:-1}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      REGISTRATION_MODE: ${REGISTRATION_MODE:-approval}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: https://api.groq.com/openai/v1
      OPENAI_MODEL: ${OPENAI_MODEL:-openai/gpt-oss-120b}
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - traefik
      - telerithm-internal
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    # 127.0.0.1, not localhost: localhost resolves to ::1 first, and the backend listens on 0.0.0.0 only.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/api/v1/health').then(r => process.exit(r.ok ? 0 : 1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      # API routes
      - "traefik.http.routers.telerithm-backend.rule=Host(`demo.telerithm.cloud`) && PathPrefix(`/api`)"
      - "traefik.http.routers.telerithm-backend.entrypoints=websecure"
      - "traefik.http.routers.telerithm-backend.tls=true"
      - "traefik.http.routers.telerithm-backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.telerithm-backend.loadbalancer.server.port=4000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: https://demo.telerithm.cloud/api/v1
    restart: unless-stopped
    logging: *default-logging
    environment:
      INTERNAL_API_BASE_URL: http://backend:4000/api/v1
      NEXT_PUBLIC_API_BASE_URL: https://demo.telerithm.cloud/api/v1
    depends_on:
      backend:
        condition: service_healthy
    # The probe asks / without following the redirect: the middleware answers
    # 307 to /login without calling the backend, so it says "the Next.js server
    # answers", not "the backend is up". /login itself renders server-side with
    # a call to the backend and answers 500 while the backend is unreachable.
    # Traefik's docker provider routes only to containers that are healthy (or
    # have no healthcheck): after each (re)start the frontend is not routed
    # until the first probe succeeds. The image has no curl or wget, hence node.
    # 127.0.0.1, not localhost: localhost resolves to ::1 first, and Next
    # listens on 0.0.0.0 only.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/', {redirect: 'manual', signal: AbortSignal.timeout(5000)}).then(r => process.exit(r.status < 400 ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - traefik
      - telerithm-internal
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      # Frontend routes (everything except /api)
      - "traefik.http.routers.telerithm-frontend.rule=Host(`demo.telerithm.cloud`)"
      - "traefik.http.routers.telerithm-frontend.entrypoints=websecure"
      - "traefik.http.routers.telerithm-frontend.tls=true"
      - "traefik.http.routers.telerithm-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.telerithm-frontend.priority=1"
      - "traefik.http.services.telerithm-frontend.loadbalancer.server.port=3000"

networks:
  traefik:
    external: true
  telerithm-internal:
    driver: bridge

volumes:
  pgdata:
    driver: local
  chdata:
    driver: local
  redisdata:
    driver: local
