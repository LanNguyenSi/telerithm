name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  NODE_ENV: test
  DATABASE_URL: postgresql://telerithm:telerithm@localhost:5432/telerithm
  CLICKHOUSE_URL: http://localhost:8123
  REDIS_URL: redis://localhost:6379

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: telerithm
          POSTGRES_PASSWORD: telerithm
          POSTGRES_DB: telerithm
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      clickhouse:
        image: clickhouse/clickhouse-server:24
        ports:
          - 8123:8123

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma Client
        working-directory: backend
        run: npx prisma generate

      # prisma/baseline.prisma is the frozen schema of the baseline migration;
      # migrate.sh compares a database from before migrations with it. If it
      # drifted from the migration's SQL, a database could be baselined that
      # does not match what the baseline migration creates. Prisma prints a
      # leading `CREATE SCHEMA IF NOT EXISTS "public"` block (three lines) and a
      # trailing blank line that the committed migration omits (see
      # CHANGELOG.md); the sed cuts those and nothing else. After a Prisma
      # upgrade that changes the script's framing, this step fails first.
      - name: Check baseline.prisma matches the baseline migration
        working-directory: backend
        run: |
          npx prisma migrate diff --from-empty --to-schema-datamodel prisma/baseline.prisma --script | sed '1,3d;$d' > "$RUNNER_TEMP/baseline.sql"
          cmp "$RUNNER_TEMP/baseline.sql" prisma/migrations/20261027132152_baseline/migration.sql || { echo "baseline.prisma no longer produces the baseline migration byte for byte"; exit 1; }

      # The script the container entrypoint runs. On the empty CI database it
      # takes the empty-database path, so this applies the committed migrations
      # with prisma migrate deploy, against the real Postgres service.
      - name: Apply the committed migrations
        working-directory: backend
        run: sh scripts/migrate.sh

      # Fails when the committed migrations do not produce the schema that
      # schema.prisma declares (`--exit-code` returns 2 on any difference), so
      # a schema change without a migration fails here.
      - name: Check migrations match schema.prisma
        working-directory: backend
        run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code

      # A second start finds the migration history the first run wrote and
      # only runs prisma migrate deploy (nothing pending).
      - name: Migration step on a migrated database
        working-directory: backend
        run: |
          out=$(sh scripts/migrate.sh 2>&1) || { echo "$out"; exit 1; }
          echo "$out"
          grep -qF "migrate: migration history found" <<< "$out" || { echo "the second run did not detect the migration history"; exit 1; }

      # A database from the releases that applied the schema with prisma db
      # push (tables, no migration history) that matches the baseline schema:
      # the script records the baseline migration as applied, once, without
      # running it. The fixture is built from baseline.prisma, not from
      # schema.prisma, which later migrations change.
      - name: Baseline of a database from before migrations
        working-directory: backend
        run: |
          psql "postgresql://telerithm:telerithm@localhost:5432/postgres" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE legacy'
          export DATABASE_URL=postgresql://telerithm:telerithm@localhost:5432/legacy
          npx prisma db push --schema prisma/baseline.prisma --skip-generate
          out=$(sh scripts/migrate.sh 2>&1) || { echo "$out"; exit 1; }
          echo "$out"
          grep -qF "recording the baseline migration" <<< "$out" || { echo "the baseline was not recorded"; exit 1; }
          rows=$(psql "$DATABASE_URL" -At -c 'SELECT count(*) FROM _prisma_migrations')
          [ "$rows" = 1 ] || { echo "expected one _prisma_migrations row, got $rows"; exit 1; }

      # The same database with one column the baseline schema does not have: the
      # script must stop with exit 1 and leave the database without a migration
      # history.
      - name: A database from before migrations that differs is left untouched
        working-directory: backend
        run: |
          psql "postgresql://telerithm:telerithm@localhost:5432/postgres" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE drifted'
          export DATABASE_URL=postgresql://telerithm:telerithm@localhost:5432/drifted
          npx prisma db push --schema prisma/baseline.prisma --skip-generate
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'ALTER TABLE "User" ADD COLUMN x text'
          set +e
          out=$(sh scripts/migrate.sh 2>&1)
          rc=$?
          set -e
          echo "$out"
          [ "$rc" = 1 ] || { echo "expected exit 1, got $rc"; exit 1; }
          grep -qF "the database schema differs from the baseline schema prisma/baseline.prisma" <<< "$out" || { echo "the difference was not reported"; exit 1; }
          history=$(psql "$DATABASE_URL" -At -c "SELECT to_regclass('public._prisma_migrations') IS NOT NULL")
          [ "$history" = f ] || { echo "the script created a migration history on a differing database"; exit 1; }

      # What the two steps above cannot show: the comparison is with the frozen
      # baseline schema, not with the current schema.prisma. A scratch copy of
      # backend/ with a second migration baselines a database at the baseline and
      # then applies the new migration, and refuses a database that already
      # equals the extended schema (see the header of the script).
      - name: Baseline against a second migration
        env:
          MIGRATE_TEST_PG: postgresql://telerithm:telerithm@localhost:5432
        run: bash scripts/baseline-second-migration.test.sh

      - name: Type check
        working-directory: backend
        run: npx tsc --noEmit

      - name: Lint
        working-directory: backend
        run: npx eslint src/

      - name: Format check
        working-directory: backend
        run: npx prettier --check src/

      - name: Unit & Integration tests with coverage
        working-directory: backend
        run: npm run test:coverage -- --coverage.reporter=json-summary --coverage.thresholds.lines=80 --coverage.thresholds.statements=80 --coverage.thresholds.functions=80 --coverage.thresholds.branches=70

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Tests with coverage
        working-directory: frontend
        run: npx vitest run --coverage --coverage.reporter=json-summary --coverage.thresholds.lines=70 --coverage.thresholds.statements=70

      - name: Build
        working-directory: frontend
        run: npm run build

  sdk-js:
    name: SDK JS
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/sdk-js/package-lock.json

      - name: Install dependencies
        working-directory: packages/sdk-js
        run: npm ci --no-audit --no-fund

      - name: Type check
        working-directory: packages/sdk-js
        run: npx tsc --noEmit

      - name: Tests with coverage
        working-directory: packages/sdk-js
        run: npx vitest run --coverage --coverage.reporter=json-summary --coverage.thresholds.lines=94 --coverage.thresholds.statements=92 --coverage.thresholds.functions=92 --coverage.thresholds.branches=85

  cli:
    name: CLI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install bats
        run: npm install -g bats --no-audit --no-fund

      - name: Run bats tests
        run: bats packages/cli/logforge-pipe.bats

  sender-configs:
    name: Sender configs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # vector validate and fluentd --dry-run against the shipped configs,
      # in the pinned images (digests pinned in the script). Any non-zero
      # exit from either docker run fails the job.
      - name: Validate sender configs
        run: bash scripts/validate-sender-configs.sh

      # Controls: each negative fixture must make the check fail, and fail with
      # the exact message its branch prints (a bare non-zero exit is not enough:
      # the step would also pass if the script broke for another reason). The
      # `out=$(...) && { ...; exit 1; }` shape replaces `!` because bash does not
      # apply errexit to a `!`-negated command, so the first such line could
      # never fail the step and only the last line counted; here every fixture
      # fails the step on its own. value-text.conf is the positive control: its
      # only oddity is a config value containing the words "is not used", which
      # the check must NOT read as an unused-parameter failure.
      - name: Negative and positive controls for the check
        run: |
          out=$(bash scripts/validate-sender-configs.sh deploy/vector/vector.toml scripts/fixtures/sender-configs/unused-param.conf 2>&1) && { echo "$out"; echo "unused-param.conf passed but must fail"; exit 1; }
          echo "$out" | grep -qF "fluentd config has an unused parameter or section (the dry run warned 'is not used'):" || { echo "$out"; echo "unused-param.conf failed for another reason"; exit 1; }

          out=$(bash scripts/validate-sender-configs.sh deploy/vector/vector.toml scripts/fixtures/sender-configs/unused-section.conf 2>&1) && { echo "$out"; echo "unused-section.conf passed but must fail"; exit 1; }
          echo "$out" | grep -qF "fluentd config has an unused parameter or section (the dry run warned 'is not used'):" || { echo "$out"; echo "unused-section.conf failed for another reason"; exit 1; }

          out=$(bash scripts/validate-sender-configs.sh deploy/vector/vector.toml scripts/fixtures/sender-configs/unset-env.conf 2>&1) && { echo "$out"; echo "unset-env.conf passed but must fail"; exit 1; }
          echo "$out" | grep -qF "fluentd config references #{ENV[...]} variables the check does not set (fluentd would substitute an empty string):" || { echo "$out"; echo "unset-env.conf failed for another reason"; exit 1; }

          out=$(bash scripts/validate-sender-configs.sh deploy/vector/vector.toml scripts/fixtures/sender-configs/bad-plugin.conf 2>&1) && { echo "$out"; echo "bad-plugin.conf passed but must fail"; exit 1; }
          echo "$out" | grep -qF "fluentd --dry-run failed" || { echo "$out"; echo "bad-plugin.conf failed for another reason"; exit 1; }

          out=$(bash scripts/validate-sender-configs.sh deploy/vector/vector.toml scripts/fixtures/sender-configs/value-text.conf 2>&1) || { echo "$out"; echo "value-text.conf failed but must pass"; exit 1; }

      # Warnings and errors fail the job; style notes (for example the ls
      # globs in backup.sh) are reported but do not.
      - name: Shellcheck
        run: shellcheck --severity=warning scripts/*.sh backend/entrypoint.sh backend/scripts/*.sh

  clickhouse-config:
    name: ClickHouse config
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # The files under backend/clickhouse only take effect through the bind
      # mounts of the two prod composes, and a wrong one shows only at the next
      # ClickHouse start (a profile in config.d is silently ignored, a malformed
      # file or a CLICKHOUSE_USER/CLICKHOUSE_PASSWORD on the read-only users.d
      # mount stops the container). The guard renders both composes and checks
      # the mounts, the XML root elements and the entrypoint variables.
      - name: Check ClickHouse config and mounts
        run: bash scripts/clickhouse-config-guard.sh

      # Controls: every mutation of the shipped files must make the guard fail
      # with the message of its own branch.
      - name: Controls for the check
        run: bash scripts/clickhouse-config-guard.test.sh

  backend-entrypoint:
    name: Backend entrypoint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # Every branch of the start-time migration decision in
      # backend/scripts/migrate.sh and backend/entrypoint.sh, against a stub
      # Prisma CLI (no database): history present, empty database, a database
      # from before migrations that matches the baseline schema (baseline
      # recorded as applied) or differs (abort), a missing prisma/baseline.prisma,
      # and every error and failed deploy.
      - name: Migration decision tests
        run: bash scripts/backend-migrate.test.sh

  relay-config:
    name: Relay config
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # agent-relay rejects an entry that is not a string and an empty
      # pre_update key (it parses as null), which fails every deploy, and a
      # build in pre_update would build the pre-pull tree; the check parses
      # .relay.yml the way the loader reads it.
      - name: Check .relay.yml
        run: bash scripts/relay-config.test.sh
