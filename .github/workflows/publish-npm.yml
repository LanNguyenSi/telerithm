name: Publish SDK to npm

on:
  push:
    tags: ["sdk-v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sdk-js
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/sdk-js/package-lock.json
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npx tsc --noEmit

      - name: Verify package.json version matches tag
        run: |
          tag_version="${GITHUB_REF_NAME#sdk-v}"
          pkg_version=$(node -p "require('./package.json').version")
          if [ "$pkg_version" != "$tag_version" ]; then
            echo "Tag version ($tag_version) does not match packages/sdk-js/package.json ($pkg_version)" >&2
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Test
        # Mirrors ci.yml's sdk-js "Tests with coverage" step so the
        # publish-time gate is the same suite CI already runs on every
        # push; a failing test here blocks the publish before it ever
        # reaches the npm upgrade / Publish steps below.
        run: npx vitest run --coverage --coverage.reporter=json-summary --coverage.thresholds.lines=94 --coverage.thresholds.statements=92 --coverage.thresholds.functions=92 --coverage.thresholds.branches=85

      - name: Upgrade npm for trusted publishing
        # npm Trusted Publishing (OIDC) needs npm >= 11.5.1; node 22 bundles
        # npm 10, so upgrade first. Auth comes from the GitHub OIDC token
        # (permissions.id-token: write above) matched against the package's
        # Trusted Publisher entry on npmjs.com (repo LanNguyenSi/telerithm,
        # workflow publish-npm.yml), not an NPM_TOKEN secret.
        run: npm install -g npm@11 --no-audit --no-fund

      - name: Publish
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#sdk-v}"
          pkg=$(node -p "require('./package.json').name")

          # Idempotency: re-running the failed job (Actions -> the failed run ->
          # Re-run failed jobs) can land on a version a prior attempt already
          # published.
          if npm view "${pkg}@${tag_version}" version > /dev/null 2>&1; then
            echo "::notice::${pkg}@${tag_version} is already on the registry; nothing to publish."
            exit 0
          fi

          # Sigstore Rekor occasionally returns a transient TLOG_CREATE_ENTRY
          # 409 (npm/cli#6892) that fails --provenance even though the tarball
          # is fine. Retry up to 3 times with exponential backoff, and treat
          # "already published" as success in case a failed attempt actually
          # reached the registry.
          max=3
          attempt=1
          while true; do
            echo "npm publish attempt ${attempt}/${max}"
            if npm publish --access public --provenance; then
              echo "::notice::Published ${pkg}@${tag_version} on attempt ${attempt}."
              exit 0
            fi
            # A failed --provenance publish can still have landed the tarball;
            # give the registry a moment to settle before checking.
            sleep 5
            if npm view "${pkg}@${tag_version}" version > /dev/null 2>&1; then
              echo "::notice::${pkg}@${tag_version} reached the registry despite a non-zero publish exit; treating as success."
              exit 0
            fi
            if [ "${attempt}" -ge "${max}" ]; then
              echo "::error::npm publish failed after ${max} attempts. If the failure is a Sigstore TLog 409, re-run the failed job on this run (Actions -> the failed run -> Re-run failed jobs) once the Rekor service recovers. A persistent 403/404 instead likely means the npmjs.com Trusted Publisher entry for this repo/workflow is missing or misconfigured; retrying will not fix that." >&2
              exit 1
            fi
            backoff=$((2 ** attempt * 5))
            echo "publish failed; retrying in ${backoff}s"
            sleep "${backoff}"
            attempt=$((attempt + 1))
          done

  github-release:
    name: GitHub Release (SDK)
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Extract SDK version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#sdk-v}" >> "$GITHUB_OUTPUT"

      - name: Extract SDK changelog for this version
        run: |
          awk '/^## \[${{ steps.version.outputs.version }}\]/{found=1; next} /^## \[/{found=0} found' packages/sdk-js/CHANGELOG.md > release_notes.md
          echo "SDK release notes extracted for sdk-v${{ steps.version.outputs.version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: "sdk-v${{ steps.version.outputs.version }}"
          body_path: release_notes.md
          generate_release_notes: false
