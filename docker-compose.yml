# Local development stack. The project name is fixed and differs from the
# production stack's (telerithm), so running `docker compose up` on a machine
# that also hosts the production stack cannot replace its containers. Every
# published port (datastores and apps) is bound to the loopback interface only
# (no credentials beyond the defaults below); reach the stack remotely by SSH.
name: telerithm-dev

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: telerithm
      POSTGRES_PASSWORD: telerithm
      POSTGRES_DB: telerithm
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telerithm"]
      interval: 5s
      timeout: 3s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:24.10
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    volumes:
      - ./backend/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    # Same hardening as the two prod composes, and nothing in the dev workflow
    # needs root here: this service mounts nothing from the host (the image
    # builds from ./backend), so there is no host-owned file it must be able to
    # write; it runs as the image's USER node.
    # scripts/app-containers-non-root.test.sh (a CI step) requires both keys on
    # the app services of all three compose files.
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    environment:
      HOST: 0.0.0.0
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: postgresql://telerithm:telerithm@postgres:5432/telerithm
      CLICKHOUSE_URL: http://clickhouse:8123
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: http://localhost:3000
      LOG_LEVEL: info
      REGISTRATION_MODE: ${REGISTRATION_MODE:-open}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@telerithm.local}
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
    # 127.0.0.1, not localhost: localhost resolves to ::1 first, and the backend listens on 0.0.0.0 only.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/api/v1/health').then(r => process.exit(r.ok ? 0 : 1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - "127.0.0.1:4000:4000"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:4000/api/v1
    # Same two keys as the backend service above (see the comment there).
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    environment:
      INTERNAL_API_BASE_URL: http://backend:4000/api/v1
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000/api/v1
    # Same probe as the prod composes (the image has no curl or wget).
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/', {redirect: 'manual', signal: AbortSignal.timeout(5000)}).then(r => process.exit(r.status < 400 ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3000:3000"
